name: Tests
on:
  push:
    branches: [main]
    # listings, submissions and docs don't need a test run
    paths-ignore: ["events.json", "llms.txt", "community/**", "screenshots/**", "**.md"]
  # submission PRs only touch community/, and GitHub skips tests on bot-opened PRs anyway
  pull_request:
    paths-ignore: ["community/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Python tests: form checks, merging sources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests
      - run: npm ci
      # the runner already has Google Chrome installed; the tests find it on their own
      - run: npm test
