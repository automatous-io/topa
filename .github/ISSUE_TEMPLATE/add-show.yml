  # venues:end
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: 11/7 or 2026-11-07
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Start time
      placeholder: 7pm
    validations:
      required: true
  - type: input
    id: end
    attributes:
      label: End time
      placeholder: 10pm
  - type: input
    id: tags
    attributes:
      label: Genres and tags
      description: Separate with commas.
      placeholder: rock, blues, 21+, free
  - type: input
    id: link
    attributes:
      label: Link for the show
      description: Tickets, the event page or the band's post about it.
      placeholder: https://
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
  - type: checkboxes
    id: ok
    attributes:
      label: Permission
      options:
        - label: I'm with the band or venue, or I know this show is happening and it's OK to list it.
          required: true
