name: Update events
on:
  schedule:
    # 3x daily, timed for evening plans. GitHub cron is UTC with no daylight saving:
    # 7am / noon / 4pm Pacific in summer (PDT), 6am / 11am / 3pm in winter (PST). Runs can start 10-30 min late.
    - cron: "17 14,19,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-events
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only; sends a descriptive User-Agent; fails (and commits nothing) if the page won't parse
      - run: python scripts/fetch_events.py --upcoming --out events.json
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- events.json llms.txt)" ]; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add events.json llms.txt
          git commit -m "Update events.json"
          git push
