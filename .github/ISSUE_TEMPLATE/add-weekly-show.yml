        - "Camarillo Barrel Works (formerly Cantara Cellars)"
        - "Camp Comfort"
        - "Carrara's"
        - "Chinaland"
        - "Chuy's Mesquite Broiler"
        - "Cisco's"
        - "Constitution Park"
        - "Crown and Anchor"
