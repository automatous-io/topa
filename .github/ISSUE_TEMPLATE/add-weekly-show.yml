        - "Wagon Wheel Brewing Co."
        - "Winchesters Grill & Saloon"
        - "The Yard"
        - "Not listed (add it first with Add or update a venue)"
    validations:
      required: true
  # venues:end
  - type: dropdown
    id: weekday
    attributes:
      label: Day of the week
      options:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Start time
      placeholder: 7pm
    validations:
      required: true
  - type: input
    id: end
    attributes:
      label: End time
      placeholder: 10pm
  - type: input
    id: first
    attributes:
      label: First date
      placeholder: 11/3 or 2026-11-03
    validations:
      required: true
  - type: input
    id: until
    attributes:
      label: Last date
      description: Up to 6 months after the first date.
      placeholder: 2027-04-27
    validations:
      required: true
  - type: input
    id: skip
    attributes:
      label: Skip these dates
      description: Weeks it's not happening, separated by commas.
      placeholder: 11/24, 12/29
  - type: input
    id: tags
    attributes:
      label: Genres and tags
      description: Separate with commas.
      placeholder: open mic, acoustic, free
  - type: input
    id: link
    attributes:
      label: Link for the show
      placeholder: https://
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
  - type: checkboxes
    id: ok
    attributes:
      label: Permission
      options:
        - label: I'm with the band or venue, or I know this show is happening. It's OK to list it, and TOPA can share it to help people find local live music.
          required: true
