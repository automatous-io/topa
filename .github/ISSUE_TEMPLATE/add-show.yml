name: Add a show
description: List one show on TOPA. It goes live once it's reviewed.
title: "Add a show"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding to TOPA! Fill this in and a bot checks it in about a minute. If something needs fixing, it says so here; otherwise it gets sent for review, and the show goes live once it's approved.
        Plays every week? Use **Add a weekly show** instead.
  - type: input
    id: band
    attributes:
      label: Band or artist
      placeholder: The Tide Pool Ramblers
    validations:
      required: true
  # venues:start
  # written by scripts/forms.py; edits here get replaced
