    validations:
      required: true
  # venues:end
  - type: input
    id: name
    attributes:
      label: Name of the new venue
      description: Only for a new venue.
      placeholder: The Driftwood Room
  - type: input
    id: address
    attributes:
      label: Street address
      description: Needed for a new venue.
      placeholder: 123 Main St, Ventura, CA 93001
  - type: input
    id: city
    attributes:
      label: Town
      description: Needed for a new venue.
      placeholder: Ventura
  - type: input
    id: coords
    attributes:
      label: Map location
      description: Paste the venue's Google Maps link, or its coordinates. This is how TOPA works out distance.
      placeholder: https://www.google.com/maps/place/... or 34.28, -119.29
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: (805) 555-0123
  - type: input
    id: website
    attributes:
      label: Website
      placeholder: https://
  - type: input
    id: instagram
    attributes:
      label: Instagram
      placeholder: "@harborlightstavern"
  - type: input
    id: facebook
    attributes:
      label: Facebook
      placeholder: https://facebook.com/...
  - type: textarea
    id: bio
    attributes:
      label: About the venue
      description: A few sentences for the venue page, like what kind of place it is and the music it hosts. Up to 1,000 characters.
      placeholder: A harborside tavern with live music on the patio every weekend.
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag a photo of the venue into this box (JPG or PNG). It fills the top of the venue's page, so a wide (landscape) photo at least 1600 pixels across looks best, with the main thing in the middle, since phones trim the sides. The outside or the stage both work, and evening or inside shots look great. It replaces any photo TOPA has. Only photos you took or have the rights to share.
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
  - type: checkboxes
    id: ok
    attributes:
      label: Permission
      options:
        - label: I work at this venue, or I know it hosts live music and these details are right. Any photo I added is mine to share, and TOPA can share all of this to help people find local live music.
          required: true
