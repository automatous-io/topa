name: Add or update a venue
description: A place with live music that TOPA doesn't have yet, or new details for one it has.
title: "Add a venue"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Add the venue first, then its shows.
        **Changing a venue TOPA has?** Pick it, then fill in just what's changing. Anything left blank stays as it is; type **remove** to clear a field.
  # venues:start
  # written by scripts/forms.py; edits here get replaced
  - type: dropdown
    id: pick
    attributes:
      label: Venue
      description: Pick the venue to change it, or pick **New venue** and type its name below.
      options:
        - "New venue (type its name below)"
        - "The Amendment Bar"
