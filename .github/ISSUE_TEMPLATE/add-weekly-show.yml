        - "Institution Ale Company"
        - "KJ's Neighborhood Bar"
        - "Latitude 34"
        - "Leashless Brewing"
        - "Libbey Bowl"
        - "The Lookout Bar & Grill"
        - "Lucky Fools Pub"
        - "Magnavino Cellars | Public Realm Brewing"
        - "The Majestic Ventura Theater"
        - "The Manhattan of Camarillo"
        - "Margarita Villa"
        - "Mrs. Olson's Coffee Hut"
        - "Muni Wine"
        - "The Mystery Shop"
        - "Nabu"
        - "Namba Arts"
        - "Nectar of the Dogs Wine"
        - "Ojai Playhouse"
        - "Ojai Ranch House"
        - "Ojai Underground Exchange"
        - "Ojai Valley Brewing"
        - "The Original Pizza Cookery"
        - "Oxnard Performing Arts Center (OPAC)"
