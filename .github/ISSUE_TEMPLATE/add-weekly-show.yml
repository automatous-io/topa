name: Add a weekly show
description: A show on the same day every week, like an open mic or a residency.
title: "Add a weekly show"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Weekly shows can be listed up to 6 months at a time. Near the end, submit this form again to keep the show going.
  - type: input
    id: band
    attributes:
      label: Band, artist or event
      placeholder: Tuesday Open Mic
    validations:
      required: true
  # venues:start
  # written by scripts/forms.py; edits here get replaced
  - type: dropdown
    id: venue
    attributes:
      label: Venue
      description: Pick the venue. Not listed? Add it first with **Add or update a venue**, then come back.
